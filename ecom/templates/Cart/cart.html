{% load static  %}
<div class="small-container cart-page">
    <table>
        <tbody><tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Subtotal</th>
        </tr>
        {%for obj in cart.order_item.all%}
        <tr>
            <td>
                <div class="cart-info">
                    <img src={{obj.product.image.url}}>
                    <div>
                        <p>{{obj.product.title}}</p>
                        <small>{{obj.product.price}}</small>
                        <br>
                        <a href="">Remove</a>
                    </div>
                </div>
            </td>
            <td><input type="number" value="{{obj.quantity}}"></td>
            <td id="" value=""></td>
        </tr>
        {%endfor%}
  
    </tbody></table>
    <div class="total-price">
        <table>
            <tbody><tr>
                <td>Subtotal</td>
                <td>$200.00</td>
            </tr>
            <tr>
                <td>Tax</td>
                <td>$35.00</td>
            </tr>
            <tr>
                <td>Total</td>
                <td>$230.00</td>
            </tr>
        </tbody></table>
    </div>
</div>
