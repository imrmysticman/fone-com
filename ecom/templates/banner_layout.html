{% load static %}
{% load custom_tags %}

    <div class="banner">
        <div class="row">
            <div class="col-2">
                {%getBanner as Banner%}
                <h1>{{Banner.heading}}</h1>
                <p>{{Banner.description}}.</p>
                <a href={% url "productdetails" Banner.product.id%} class="btn">Buy Now &#8594;</a>
            </div>
            <div class="col-4">
                <img src={{Banner.product.image.url}}>
            </div>
        </div>
    </div>
