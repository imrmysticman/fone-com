{% load static %}
<div class="navbar">
    <div class="logo">
        <a href="index.html"><img src={% static "images/logo.png"%} alt="logo" width="125px"></a>
    </div>

<nav>
    <ul id="MenuItems">
        <li><a href={% url "index"%}>Home</a></li>
        <li><a href={% url "products"%}>Products</a></li>
        {%if request.user.is_authenticated%}
        <li><a href={%url "logout"%}>Logout</a></li>
        {%else%}
        <li><a href={%url "account"%}>Login</a></li>
        {%endif%}
    </ul>
</nav>
<a href={%url "cart"%}><img src={% static "images/cart.png"%} width="30px" height="30px"></a>
            <img src={% static "images/menu.png"%}class="menu-icon" onclick=menutoggle()>

    <!-- javascript -->

    <script>
        var MenuItems = document.getElementById("MenuItems");
        MenuItems.style.maxHeight = "0px";
        function menutoggle() {
            if (MenuItems.style.maxHeight == "0px") {
                MenuItems.style.maxHeight = "200px"
            }
            else {
                MenuItems.style.maxHeight = "0px"
            }
        }
    </script>
